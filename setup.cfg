[flake8]
max-line-length = 120
exclude = .git,__pycache__,.venv,*/migrations/*,staticfiles
max-complexity = 10

[coverage:run]
source = api,demo
branch = True
omit =
    */migrations/*
    */tests.py
    demo/asgi.py
    demo/wsgi.py
    manage.py

[coverage:report]
show_missing = True
fail_under = 80
