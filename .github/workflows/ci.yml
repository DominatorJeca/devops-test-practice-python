name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  #Build
  build:
    name: Code Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compilar y validar la configuracion de Django
        run: |
          python -m compileall -q api demo manage.py
          python manage.py check

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: demo
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo123
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U demo -d demo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: solo-para-ci-no-es-un-secreto-real
      DB_ENGINE: postgres
      DB_NAME: demo
      DB_USER: demo
      DB_PASSWORD: demo123
      DB_HOST: localhost
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ejecutar tests
        run: coverage run manage.py test --verbosity 2
      - name: Reporte de cobertura
        run: |
          coverage report
          coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: flake8 (estilo y errores)
        run: flake8 .
      - name: bandit (seguridad del codigo)
        run: bandit -r api demo -ll

  #SonarQ
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  manifests:
    name: Validar manifiestos kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renderizar overlay local
        run: kubectl kustomize k8s/overlays/local > rendered.yaml
      - name: Validar esquemas de la API
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas rendered.yaml

  #Docker
  image:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build, test, lint, manifests]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre en minusculas
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.image.outputs.image }}
          severity: HIGH,CRITICAL 
          ignore-unfixed: true
          exit-code: '1'

      - name: Informe completo
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.image.outputs.image }}
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table
  deploy:
    name: Deploy Kubernetes
    runs-on: ubuntu-latest
    needs: [image, scan]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Crear cluster kind efimero
        uses: helm/kind-action@v1
        with:
          cluster_name: ci
          config: .github/kind-config.yaml

      - name: Instalar ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=240s

      - name: Instalar kustomize
        run: |
          curl -sS "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Fijar la imagen construida en esta ejecucion
        working-directory: k8s/overlays/ci
        run: kustomize edit set image devsu-demo=${{ needs.image.outputs.image }}

      - name: Precargar la imagen en nodo
        run: |
          docker pull ${{ needs.image.outputs.image }}
          kind load docker-image ${{ needs.image.outputs.image }} --name ci

      - name: Desplegar
        run: kubectl apply -k k8s/overlays/ci

      - name: Esperar a las migraciones
        run: kubectl wait --for=condition=complete job/demo-migrate -n devsu-demo --timeout=300s

      - name: Esperar al rollout de las replicas
        run: kubectl rollout status deployment/demo-api -n devsu-demo --timeout=300s

      - name: Esperar que Ingress enrute trafico(solucion a error previo)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null -H "Host: demo-devops.local" http://localhost/api/health/; then
              echo "Ingress enrutando correctamente (intento $i)"
              exit 0
            fi
            sleep 2
          done
          echo "El Ingress no enruto trafico en 60 segundos"
          exit 1

      - name: Smoke test contra el Ingress
        run: |
          set -eo pipefail
          echo "── health ──"
          curl -fsS -H "Host: demo-devops.local" http://localhost/api/health/; echo
          echo "── ready ──"
          curl -fsS -H "Host: demo-devops.local" http://localhost/api/ready/; echo
          echo "── crear usuario ──"
          curl -fsS -X POST http://localhost/api/users/ \
            -H "Host: demo-devops.local" \
            -H "Content-Type: application/json" \
            -d '{"dni":"9999999999","name":"Smoke Test CI"}'; echo
          echo "── listar usuarios ──"
          curl -fsS -H "Host: demo-devops.local" http://localhost/api/users/; echo

      - name: Estado final del cluster
        run: kubectl get all,ingress,hpa,pdb,netpol -n devsu-demo

      - name: Diagnostico por fallo
        if: failure()
        run: |
          kubectl get pods -n devsu-demo -o wide || true
          kubectl describe pods -n devsu-demo || true
          kubectl logs -n devsu-demo -l app.kubernetes.io/name=demo-api --tail=100 || true
          kubectl logs -n devsu-demo job/demo-migrate --tail=100 || true
